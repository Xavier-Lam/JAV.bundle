name: Code Style

on:
  pull_request:
    branches: [master, main]
    paths:
      - "**/*.py"

jobs:
  autopep8:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install autopep8
        run: pip install autopep8==1.6.0 pycodestyle==2.8.0

      - name: Check formatting
        run: |
          autopep8 --diff --recursive --aggressive Contents/Code/ > autopep8.diff
          if [ -s autopep8.diff ]; then
            echo "::error::Code is not formatted. Run autopep8 --in-place --recursive --aggressive Contents/Code/ to fix."
            cat autopep8.diff
            exit 1
          fi
